<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello - Terminal Gateway</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top left, #0e1118, #05070a);
      --glass-bg: rgba(13, 17, 23, 0.75);
      --glass-border: rgba(255, 255, 255, 0.08);
      --color-primary: #58a6ff;
      --color-primary-glow: rgba(88, 166, 255, 0.35);
      --text-main: #e6edf3;
      --text-muted: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Grid Overlay background */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.007) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.007) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: 0;
      pointer-events: none;
    }

    /* Floating glowing orb */
    .glow-orb {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--color-primary-glow) 0%, transparent 70%);
      filter: blur(40px);
      z-index: 1;
      animation: float-around 10s infinite alternate ease-in-out;
    }

    /* Glass Card */
    .card {
      position: relative;
      z-index: 2;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      padding: 48px 64px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    h1 {
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #ffffff 30%, var(--color-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      text-shadow: 0 0 40px var(--color-primary-glow);
    }

    p {
      color: var(--text-muted);
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    /* Back Button */
    .btn-back {
      margin-top: 32px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 8px;
      transition: all 0.3s ease;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-back:hover {
      background: var(--color-primary-glow);
      border-color: var(--color-primary);
      box-shadow: 0 0 15px var(--color-primary-glow);
      transform: translateY(-2px);
    }

    /* Animations */
    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float-around {
      0% {
        transform: translate(-10%, -10%);
      }
      100% {
        transform: translate(10%, 10%);
      }
    }
  </style>
</head>
<body>
  <div class="glow-orb"></div>
  <div class="card">
    <h1>hello</h1>
    <p>Welcome to your new page.</p>
    <a href="index.html" class="btn-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Go Back to Console
    </a>
  </div>
</body>
</html>
